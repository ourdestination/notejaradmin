<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#16202b;--muted:#667385;--line:#dbe3ec;--primary:#1f4e79;--primary-soft:#e6eef7;--danger:#c0392b;--ok:#1e8449;--warn:#b9770e;--top:#17324f;--page:#dfe6ee;--shadow:rgba(23,50,79,.14);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1319;--card:#171e27;--text:#e6ebf1;--muted:#8f9bab;--line:#263140;--primary:#5b9bd5;--primary-soft:#1b2a3b;--danger:#e8604f;--ok:#4cc17f;--warn:#e0a63a;--top:#141b24;--page:#06090d;--shadow:rgba(0,0,0,.55)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--page);color:var(--text);overflow:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit}
svg{display:block}
/* ---- app shell: a phone-sized column, full screen on phones ---- */
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:560px){#app{box-shadow:0 0 0 1px var(--line),0 10px 40px var(--shadow)}}
header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px 16px;background:var(--top);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:5}
header .hd{flex:1;min-width:0}
header h1{margin:0;font-size:19px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{display:block;font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{flex:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#ffffff1f;color:#fff;border:0;border-radius:50%;cursor:pointer;padding:0}
header button svg{width:21px;height:21px}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 14px 22px}
/* ---- bottom tab bar ---- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;min-width:0}
.tabbar .ti{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;transition:background .15s}
.tabbar .ti svg{width:23px;height:23px}
.tabbar .on{color:var(--primary)}.tabbar .on .ti{background:var(--primary-soft)}
.tabbar .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{position:absolute;top:-3px;right:5px;background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 5px;min-width:17px;line-height:17px;text-align:center}
/* ---- "More" bottom sheet ---- */
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:8px 14px calc(14px + var(--sab));animation:up .2s ease-out;box-shadow:0 -6px 24px var(--shadow)}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet .sh{font-weight:700;font-size:13px;color:var(--muted);margin:2px 6px 6px;text-transform:uppercase;letter-spacing:.04em}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 8px;border:0;background:none;border-radius:12px;text-align:left;font-size:16px;font-weight:600;cursor:pointer}
.sheet button:active{background:var(--primary-soft)}
.sheet button.on{color:var(--primary)}
.sheet .ic{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.sheet .ic svg{width:21px;height:21px}
.sheet .lb{flex:1}
.sheet .n{position:static;margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ---- content ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:11px 0;box-shadow:0 1px 3px rgba(23,50,79,.06)}
h2{margin:12px 2px 4px;font-size:20px}
h3{margin:0 0 8px;font-size:15px;color:var(--primary)}
.sub{margin:0 2px 10px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(23,50,79,.06)}
.stat:active{background:var(--primary-soft)}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
button.b{min-height:42px;padding:9px 16px;border-radius:12px;background:var(--primary);color:#fff;border:0;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer}
button.b:active{opacity:.85}
.bar input{min-width:0}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:#16202b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,480px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.on{opacity:1}#toast.err{background:#a93226}
/* ---- login ---- */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--bg),var(--primary-soft))}
#login .card{width:100%;max-width:400px;margin:0;padding:24px 20px;border-radius:22px}
#login .lock{width:68px;height:68px;border-radius:20px;background:var(--primary);color:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
#login .lock svg{width:34px;height:34px}
.muted{color:var(--muted);font-size:13px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary)}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:500}
.chk input{margin-top:4px;flex:none}
button.b.s{background:transparent;color:var(--text);border:1.5px solid var(--line)}
button.b.d{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
button.b:disabled{opacity:.5;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert b{color:var(--danger)}
.top{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.top .t{flex:1 1 150px;font-weight:700;word-break:break-word}
.badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.ok{background:#1e844920;color:var(--ok)}.badge.warn{background:#b9770e22;color:var(--warn)}.badge.bad{background:#c0392b20;color:var(--danger)}
.kv{font-size:13.5px;margin-top:3px;word-break:break-all}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1;min-width:0}.bar select{width:auto}
.thread{max-height:300px;overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:7px 11px;border-radius:12px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.me{align-self:flex-end;background:var(--primary-soft)}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.ls{font-size:12.5px;color:var(--muted);margin-top:3px}.ls.on{color:var(--ok);font-weight:700}
.pic{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.det{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;gap:12px;align-items:flex-start}
.det .kv{margin-top:2px}
.logrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.logrow:last-child{border:0}
.logrow small{display:block;color:var(--muted);font-size:12px}
.rep{margin-top:6px;font-size:13px;color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.box{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:11px 12px;margin:8px 0;font-size:14px}
.err{color:var(--danger);font-size:13px;min-height:19px;margin-top:8px}
.fday{border-top:1px solid var(--line);padding:9px 0 3px;margin-top:8px}.fitem{margin:5px 0 6px 2px}.fitem summary{cursor:pointer;padding:3px 0}.fitem .box{margin:6px 0}.fitem a{font-size:13px;color:var(--primary)}

button.b.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px}

/* ---- logo ---- */
.logo{display:block;width:84px;height:84px;margin:0 auto 12px;border-radius:22px;box-shadow:0 6px 18px var(--shadow)}
.hlogo{flex:none;width:36px;height:36px;border-radius:10px}
#side{display:none}
/* ---- PC mode: sidebar + wide content (screens 900px and wider) ---- */
@media(min-width:900px){
  #app{max-width:none;margin:0;box-shadow:none;display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side head" "side main"}
  #side{grid-area:side;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
  #side .brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
  #side .brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 3px 10px var(--shadow)}
  #side .brand b{display:block;font-size:18px;line-height:1.15}
  #side .brand span{font-size:12.5px;color:var(--muted)}
  #side-nav{padding:6px 12px 20px;display:flex;flex-direction:column;gap:3px}
  #side-nav button{display:flex;align-items:center;gap:13px;width:100%;padding:11px 12px;border:0;background:none;border-radius:12px;text-align:left;font-size:15px;font-weight:600;color:var(--text);cursor:pointer}
  #side-nav button:hover{background:var(--primary-soft)}
  #side-nav button.on{background:var(--primary-soft);color:var(--primary)}
  #side-nav .ic{width:24px;height:24px;display:flex;flex:none}
  #side-nav .ic svg{width:22px;height:22px}
  #side-nav .lb{flex:1}
  #side-nav .n{position:static;margin:0}
  header{grid-area:head;padding:14px 28px}
  header h1{font-size:21px}
  .hlogo{display:none}
  main{grid-area:main;padding:10px 28px 40px}
  main>*{max-width:1060px;margin-left:auto;margin-right:auto}
  .tabbar{display:none}
  .grid{grid-template-columns:repeat(4,1fr)}
  .card{padding:16px 20px}
  #toast{bottom:28px}
  .sbg{display:none}
}
.pwrap{position:relative}.pwrap input{padding-right:46px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}.eye:active{background:var(--primary-soft)}.eye svg{width:21px;height:21px}

/* v146: gift cards */
.gface{position:relative;overflow:hidden;border-radius:18px;padding:18px 14px;color:#fff;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gface .gimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gface .gimg~*{position:relative;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.gface .ge{font-size:44px;line-height:1}
.gface .gt{font-size:19px;font-weight:700;word-break:break-word}
.gface .gw{font-size:14px;opacity:.96;white-space:pre-wrap;word-break:break-word}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ggrid .card{margin:0}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=color]{height:44px;padding:3px}
.gprev{margin:8px 0 4px;max-width:340px}
</style>
</head>

</div>

function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "value") e.value = v;
    else if (k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

function watch(path, key) {

    S[key] = key === "upd" || key === "notice" || key === "hdb" ? s.val() : (s.val() || {});
    if (key === "phones") { loadNames(); loadMeta(); }
    if (key === "warn") sweep();
    render();
  }, e => toast(path + ": " + (e.message || "read failed"), true)));
}
function start() {
  stop();

  watch("phones", "phones"); watch("loginEmail", "emails"); watch("idRequests", "reqs"); watch("loginReq", "lreqs");
  watch("locked", "locked"); watch("suspended", "susp"); watch("deleteWarn", "warn"); watch("admins", "admins");
  watch("approved", "approved"); watch("reports", "reports"); watch("appInfo", "appInfo"); watch("forceLogout", "fl");

}
